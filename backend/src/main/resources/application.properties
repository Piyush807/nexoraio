spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
# Refresh token lifetime in ms. Defaults to 7 days if not set via env.
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# Set to true in any real (https) deployment. Left false so the cookie
# works over plain http://localhost during local development.
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Strict}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
logging.level.org.springframework.web.client=INFO

# Comma-free single frontend origin. Set this to the deployed HTTPS frontend origin in production.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Keep update for local development compatibility. Use a versioned migration strategy before production schema management.
